[mypy]
python_version = 3.12

# SaMD 向けの安全性強化
warn_unused_configs = True
warn_return_any = True
warn_unused_ignores = True

# 型なし関数を禁止
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Optional を厳格に扱う
strict_optional = True
no_implicit_optional = True

# Any を極力排除
disallow_any_generics = True

# 外部ライブラリの型不足を無視
[mypy-openai.*]
ignore_missing_imports = True

[mypy-app.schemas.*]
ignore_missing_imports = True

# コアロジックは strict モード
[mypy-app.services.generate_snp]
strict = True

[mypy-app.services.generate_sequence]
strict = True

[mypy-app.services.generate_panel]
strict = True
